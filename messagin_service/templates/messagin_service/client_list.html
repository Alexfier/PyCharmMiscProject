{% extends 'messagin_service/base.html' %}
{% block content %}
<div class="container">
    <div class="row text-center">
        <a class="btn btn-primary" href="{% url 'messagin_service:client_create' %}" role="button">Добавить пользователя</a>
        <div class="col-3">
        {% for client in object_list %}
            <div class="card mb-3 box-shadow">
                <div class="card-header">
                    </div>
                        <div class="card-body">
                        <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li>- {{ client.email }}</li>
                        <li>- {{ client.full_name }}</li>
                        <li>- {{ client.comment }}</li></ul>
                        <a class="btn btn-primary" href="{% url 'messagin_service:client_update' client.pk %}" role="button">Редактировать</a>
                        <a class="btn btn-primary" href="{% url 'messagin_service:client_delete' client.pk %}" role="button">Удалить</a>
                        </div>
                </div>
        {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
