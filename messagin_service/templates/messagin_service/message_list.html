{% extends 'messagin_service/base.html' %}
{% block content %}
<div class="container">
    <div class="row text-center">
        <a class="btn btn-primary" href="{% url 'messagin_service:message_create' %}" role="button">Добавить сообщение</a>
        <div class="col-3">
        {% for message in object_list %}
            <div class="card mb-3 box-shadow">
                <div class="card-header">
                    </div>
                        <div class="card-body">
                        <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li>- {{ message.subject }}</li>
                        <li>- {{ message.body }}</li>
                        <a class="btn btn-primary" href="{% url 'messagin_service:message_update' message.pk %}" role="button">Редактировать</a>
                        <a class="btn btn-primary" href="{% url 'messagin_service:message_delete' message.pk %}" role="button">Удалить</a>
                        </div>
                </div>
        {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
