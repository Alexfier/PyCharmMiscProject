[tool.poetry]
name = "course-project-habit-tracker"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.4"
djangorestframework = "^3.16.0"
psycopg2 = "^2.9.10"
python-dotenv = "^1.1.1"
django-stubs = "^5.2.2"
djangorestframework-stubs = "^3.16.1"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.10.1"
drf-spectacular = {extras = ["sidecar"], version = "^0.28.0"}
celery = "^5.5.3"
redis = "^6.2.0"
django-celery-beat = "^2.8.1"
django-cors-headers = "^4.7.0"
faker = "^37.5.3"
gunicorn = "^23.0.0"
eventlet = "^0.40.2"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
isort = "^6.0.1"
black = "^25.1.0"
mypy = "^1.17.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
exclude = '''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 79
multi_line_output = 5
